# Prose checks for the OneXtel docs. Run locally with: vale <file>.mdx
StylesPath = styles
MinAlertLevel = suggestion
Vocab = OneXtel

[formats]
# Treat MDX as Markdown so fenced code blocks and inline code are skipped.
mdx = md

[*.{md,mdx}]
BasedOnStyles = OneXtel

# Vale's own spelling and term checks are too noisy for a docs set full of
# product names, codes and payload fields. Keep only the repetition check.
Vale.Repetition = YES

BlockIgnores = (?s) *(```.*?```)
# Don't lint component props, code, or link targets.
TokenIgnores = (<[A-Z][^>]*>), (\]\([^)]+\)), (`[^`]+`)
