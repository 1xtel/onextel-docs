name: Docs checks

# Every pull request into main runs these, whoever opened it.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prose:
    name: House style (Vale)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check prose against the OneXtel style
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          files: '["api-reference", "guides", "plugins", "legacy", "index.mdx"]'
          fail_on_error: true
          filter_mode: nofilter
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and links (Mintlify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate the build
        run: npx -y mint@4.2.917 validate
      - name: Check for broken links
        run: npx -y mint@4.2.917 broken-links
